spring.application.name=pitatoku
server.port=8080

# デバッグ設定
logging.level.org.thymeleaf=DEBUG
logging.level.org.springframework.web=DEBUG

# Thymeleaf設定
spring.thymeleaf.prefix=file:/app/src/main/resources/templates/
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# MySQL接続設定
spring.datasource.url=jdbc:mysql://localhost:3306/pitatoku
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ログレベル設定
logging.level.com.example.demo=INFO
logging.level.com.example.demo.service.AllStatusService=INFO
logging.level.com.example.demo.controller.DashboardController=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n