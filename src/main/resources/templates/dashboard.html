<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ぴた得 Pitatoku</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>ぴた得</h1>
        <p class="subtitle">なんでもピタッと在庫管理</p>
      </header>

      <!-- アイテム追加ボタン -->
      <section class="add-item-section">
        <a href="/add-item" class="add-item-btn">+追加</a>
      </section>

      <!-- 削除モーダル -->
      <div class="modal-overlay" id="deleteModal">
        <div class="delete-modal">
          <h3>削除の確認</h3>
          <p id="deleteMessage">このアイテムを削除しますか？</p>
          <div class="modal-buttons">
            <button class="modal-btn cancel" onclick="closeDeleteModal()">
              キャンセル
            </button>
            <button class="modal-btn delete" onclick="confirmDelete()">
              削除
            </button>
          </div>
        </div>
      </div>

      <!-- 完了モーダル -->
      <div class="modal-overlay" id="completeModal">
        <div class="complete-modal">
          <h3>完了の確認</h3>
          <p id="completeMessage">このアイテムを完了としてマークしますか？</p>
          <div class="modal-buttons">
            <button class="modal-btn cancel" onclick="closeCompleteModal()">
              キャンセル
            </button>
            <button class="modal-btn complete" onclick="confirmComplete()">
              完了
            </button>
          </div>
        </div>
      </div>

      <!-- 全体の状況 -->
      <section class="status-overview">
        <h2>全体の状態</h2>
        <div class="status-cards">
          <div class="status-pattern down" th:classappend="${statusData.statusClass == 'down'} ? 'active' : ''">
            <h3>Take action!</h3>
          </div>
          <div class="status-pattern nice" th:classappend="${statusData.statusClass == 'nice'} ? 'active' : ''">
            <h3>Nice!!</h3>
          </div>
          <div class="status-pattern high" th:classappend="${statusData.statusClass == 'high'} ? 'active' : ''">
            <h3>Take it easy!</h3>
          </div>
        </div>
      </section>

      <!-- アイテム一覧 -->
      <section class="item-list">
        <h2>アイテム一覧</h2>
        <div class="item-list-container">
          <table class="item-table">
            <thead>
              <tr>
                <th></th>
                <th>名前</th>
                <th>状態</th>
                <th>メモ</th>
                <th>更新日時</th>
                <th></th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="item : ${items}">
                <td>
                  <button class="delete-btn" th:data-id="${item.id}" th:data-name="${item.itemName}">
                    削除
                  </button>
                </td>
                <td th:text="${item.itemName}">アイテム名</td>
                <td th:text="${item.status.displayName}">状態</td>
                <td th:text="${item.memo}">メモ</td>
                <td th:text="${item.updatedAt}">更新日時</td>
                <td>
                  <a th:href="@{/edit-item(id=${item.id})}" class="edit-btn">編集</a>
                </td>
                <td>
                  <button class="complete-btn" th:data-id="${item.id}" th:data-name="${item.itemName}">
                    完了
                  </button>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(items)}">
                <td colspan="7" class="no-items">アイテムがありません</td>
              </tr>
            </tbody>
          </table>
          <!-- アイテム追加ボタン -->
          <a href="/add-item" class="add-item-btn">+追加</a>
        </div>
      </section>
    </div>
    <script src="/js/dashboard.js"></script>
  </body>
</html>
