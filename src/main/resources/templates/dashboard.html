<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ダッシュボード - ぴた得</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1><a href="/dashboard" class="header-link">ぴた得</a></h1>
        <p class="subtitle">ダッシュボード</p>
      </header>

      <section class="item-list">
        <h2>アイテム一覧</h2>
        <div class="item-list-container">
          <table class="item-table">
            <thead>
              <tr>
                <th></th>
                <th>名前</th>
                <th>状態</th>
                <th>メモ</th>
                <th>更新日時</th>
                <th></th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="item : ${items}">
                <td>
                  <button
                    class="delete-btn"
                    th:data-id="${item.id}"
                    th:data-name="${item.itemName}"
                  >
                    削除
                  </button>
                </td>
                <td th:text="${item.itemName}">アイテム名</td>
                <td
                  class="status-cell"
                  th:data-status="${item.status}"
                  th:data-status-type="${item.statusType}"
                  th:text="${item.status.displayName}"
                >
                  状態
                </td>
                <td th:text="${item.memo}">メモ</td>
                <td th:text="${item.updatedAt}">更新日時</td>
                <td>
                  <a th:href="@{/edit-item(id=${item.id})}" class="edit-btn"
                    >編集</a
                  >
                </td>
                <td>
                  <button
                    class="complete-btn"
                    th:data-id="${item.id}"
                    th:data-name="${item.itemName}"
                  >
                    完了
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="add-item-section">
          <!-- アイテム追加ボタン -->
          <a href="/add-item" class="add-item-btn">+追加</a>
        </div>
      </section>
    </div>

    <script>
      console.log('=== DASHBOARD SCRIPT START ===');

      // 強制的にテスト実行
      function forceTest() {
        console.log('=== FORCE TEST START ===');

        // 要素の存在確認
        const statusTypeSelect = document.getElementById('statusType');
        const statusCells = document.querySelectorAll('.status-cell');

        console.log('statusTypeSelect:', statusTypeSelect);
        console.log('statusCells count:', statusCells.length);

        if (statusTypeSelect) {
          console.log('statusTypeSelect value:', statusTypeSelect.value);
          console.log(
            'statusTypeSelect options:',
            statusTypeSelect.options.length
          );
        }

        if (statusCells.length > 0) {
          statusCells.forEach((cell, index) => {
            console.log(`Cell ${index}:`, {
              textContent: cell.textContent,
              dataStatus: cell.getAttribute('data-status'),
              className: cell.className,
            });
          });
        }

        console.log('=== FORCE TEST END ===');
      }

      // 用途変更時にステータス表示を更新
      function updateStatusDisplay() {
        console.log('=== updateStatusDisplay START ===');

        const statusCells = document.querySelectorAll('.status-cell');

        console.log('Found status cells:', statusCells.length);

        if (statusCells.length === 0) {
          console.error('No status cells found!');
          return;
        }

        statusCells.forEach((cell, index) => {
          const statusEnum = cell.getAttribute('data-status');
          const statusType = cell.getAttribute('data-status-type');
          const originalText = cell.textContent.trim();

          console.log(`Cell ${index}:`, {
            statusEnum: statusEnum,
            statusType: statusType,
            originalText: originalText,
          });

          let newText = '';
          let typeLabel = '';

          // 各アイテムの登録時の用途に応じた表示名に変更
          if (statusType === 'books') {
            if (statusEnum === 'INTERESTED') newText = '未購入';
            else if (statusEnum === 'PURCHASED') newText = '購入済み';
            else if (statusEnum === 'WORKING') newText = '作業中';
            else if (statusEnum === 'COMPLETED') newText = '完了';
            else newText = originalText;
            typeLabel = '積み本';
          } else if (statusType === 'tasks') {
            if (statusEnum === 'INTERESTED') newText = 'ToMore';
            else if (statusEnum === 'PURCHASED') newText = 'ToDo';
            else if (statusEnum === 'WORKING') newText = 'Now!!';
            else if (statusEnum === 'COMPLETED') newText = '完了';
            else newText = originalText;
            typeLabel = '作業管理';
          } else if (statusType === 'inventory') {
            if (statusEnum === 'INTERESTED') newText = 'あれば欲しい';
            else if (statusEnum === 'PURCHASED') newText = '在庫なし';
            else if (statusEnum === 'WORKING') newText = '在庫あり';
            else if (statusEnum === 'COMPLETED') newText = '完了';
            else newText = originalText;
            typeLabel = '生活品在庫管理';
          } else {
            newText = originalText;
            typeLabel = 'デフォルト';
          }

          // 「状態/用途」の形式で表示
          if (statusType !== 'default') {
            cell.textContent = `${newText}/${typeLabel}`;
          } else {
            cell.textContent = newText;
          }

          console.log(`Cell ${index} updated:`, {
            from: originalText,
            to: cell.textContent,
          });
        });

        console.log('=== updateStatusDisplay END ===');
      }

      // 即座にテスト実行
      forceTest();

      // DOMContentLoadedで初期化
      document.addEventListener('DOMContentLoaded', function () {
        console.log('=== DOMContentLoaded START ===');
        forceTest();

        const statusTypeSelect = document.getElementById('statusType');
        if (statusTypeSelect) {
          console.log('Adding event listener to statusTypeSelect');
          statusTypeSelect.addEventListener('change', function () {
            console.log('Status type changed to:', this.value);
            updateStatusDisplay();
          });

          // 初期表示を更新
          updateStatusDisplay();
        } else {
          console.error('statusTypeSelect not found!');
        }

        console.log('=== DOMContentLoaded END ===');
      });

      // 遅延実行
      setTimeout(function () {
        console.log('=== setTimeout START ===');
        forceTest();
        updateStatusDisplay();
        console.log('=== setTimeout END ===');
      }, 500);

      console.log('=== DASHBOARD SCRIPT END ===');

      // 削除ボタンの機能
      function setupDeleteButtons() {
        const deleteButtons = document.querySelectorAll('.delete-btn');
        deleteButtons.forEach((button) => {
          button.addEventListener('click', function () {
            const itemId = this.getAttribute('data-id');
            const itemName = this.getAttribute('data-name');

            if (confirm(`「${itemName}」を削除しますか？`)) {
              const form = document.createElement('form');
              form.method = 'POST';
              form.action = '/delete-item';

              const idInput = document.createElement('input');
              idInput.type = 'hidden';
              idInput.name = 'id';
              idInput.value = itemId;

              form.appendChild(idInput);
              document.body.appendChild(form);
              form.submit();
            }
          });
        });
      }

      // 完了ボタンの機能
      function setupCompleteButtons() {
        const completeButtons = document.querySelectorAll('.complete-btn');
        completeButtons.forEach((button) => {
          button.addEventListener('click', function () {
            const itemId = this.getAttribute('data-id');
            const itemName = this.getAttribute('data-name');

            if (confirm(`「${itemName}」を完了にしますか？`)) {
              const form = document.createElement('form');
              form.method = 'POST';
              form.action = '/complete-item';

              const idInput = document.createElement('input');
              idInput.type = 'hidden';
              idInput.name = 'id';
              idInput.value = itemId;

              form.appendChild(idInput);
              document.body.appendChild(form);
              form.submit();
            }
          });
        });
      }

      // DOMContentLoadedでボタン機能を設定
      document.addEventListener('DOMContentLoaded', function () {
        setupDeleteButtons();
        setupCompleteButtons();
      });

      // 遅延実行でもボタン機能を設定
      setTimeout(function () {
        setupDeleteButtons();
        setupCompleteButtons();
      }, 500);
    </script>
  </body>
</html>
