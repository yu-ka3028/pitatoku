<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>アイテム編集 - ぴた得</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/edit-item.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1><a href="/dashboard" class="header-link">ぴた得</a></h1>
        <p class="subtitle">アイテム編集</p>
      </header>

      <section class="form-section">
        <div class="form-container">
          <h2>アイテム情報</h2>
          <form class="item-form" action="/update-item" method="post">
            <input type="hidden" name="id" th:value="${item.id}" />
            <div class="form-group">
              <label for="item-name">名前</label>
              <input
                type="text"
                id="item-name"
                name="item_name"
                th:value="${item.itemName}"
                required
              />
            </div>
            <div class="form-group">
              <label for="item-status">状態</label>
              <select
                id="statusType"
                name="status_type"
                onchange="updateStatusDisplay()"
              >
                <option
                  value="default"
                  th:selected="${item.statusType == 'default'}"
                >
                  デフォルト
                </option>
                <option
                  value="books"
                  th:selected="${item.statusType == 'books'}"
                >
                  積み本
                </option>
                <option
                  value="tasks"
                  th:selected="${item.statusType == 'tasks'}"
                >
                  作業管理
                </option>
                <option
                  value="inventory"
                  th:selected="${item.statusType == 'inventory'}"
                >
                  生活品在庫管理
                </option>
              </select>
              <select id="item-status" name="status" required>
                <option value="">状態を選択</option>
                <option
                  value="interested"
                  th:selected="${item.status == T(com.example.demo.model.Status).INTERESTED}"
                  data-default="ToMore"
                  data-books="未購入"
                  data-tasks="ToMore"
                  data-inventory="あれば欲しい"
                >
                  ToMore
                </option>
                <option
                  value="purchased"
                  th:selected="${item.status == T(com.example.demo.model.Status).PURCHASED}"
                  data-default="ToDo"
                  data-books="購入済み"
                  data-tasks="ToDo"
                  data-inventory="在庫なし"
                >
                  ToDo
                </option>
                <option
                  value="working"
                  th:selected="${item.status == T(com.example.demo.model.Status).WORKING}"
                  data-default="Now!!"
                  data-books="作業中"
                  data-tasks="Now!!"
                  data-inventory="在庫あり"
                >
                  Now!!
                </option>
              </select>
            </div>
            <div class="form-group">
              <label for="item-memo">メモ</label>
              <textarea
                id="item-memo"
                name="memo"
                placeholder="メモを入力（任意）"
                rows="4"
                th:text="${item.memo}"
              ></textarea>
            </div>

            <div class="form-actions">
              <button type="submit" class="submit-btn">保存</button>
              <a href="/dashboard" class="cancel-btn">キャンセル</a>
            </div>
          </form>
        </div>
      </section>
    </div>
    <script src="/js/add-item.js"></script>
    <script>
      // デバッグ用：ページ読み込み完了を確認
      console.log('edit-item page loaded');

      // 用途変更時にステータス表示を更新
      function updateStatusDisplay() {
        const selectedType = document.getElementById('statusType').value;
        const statusOptions = document.querySelectorAll(
          '#item-status option[value]'
        );

        console.log('Selected type:', selectedType);
        console.log('Found options:', statusOptions.length);

        statusOptions.forEach((option) => {
          let newText = option.textContent.trim();

          if (selectedType === 'books') {
            newText = option.getAttribute('data-books');
          } else if (selectedType === 'tasks') {
            newText = option.getAttribute('data-tasks');
          } else if (selectedType === 'inventory') {
            newText = option.getAttribute('data-inventory');
          } else {
            newText = option.getAttribute('data-default');
          }

          console.log(
            'Updating option:',
            option.value,
            'from',
            option.textContent.trim(),
            'to',
            newText
          );
          option.innerHTML = newText;
        });
      }

      // ページ読み込み時に初期化
      document.addEventListener('DOMContentLoaded', function () {
        console.log('DOM loaded, initializing...');
        updateStatusDisplay();
      });
    </script>
  </body>
</html>
